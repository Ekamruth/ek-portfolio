name: Deploy to GitHub Pages

# WHEN should this run?
on:
  push:
    branches: [main]    # Only when code is pushed to main branch
  workflow_dispatch:     # Also allows manual trigger from GitHub UI

# PERMISSIONS the workflow needs
permissions:
  contents: read         # To checkout your code
  pages: write          # To deploy to GitHub Pages
  id-token: write       # Required for Pages deployment auth

# WHAT should it do?
defaults:
  run:
    working-directory: ek-portfolio    # All commands run inside the subfolder

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest    # Use a fresh Ubuntu VM

    environment:
      name: github-pages
      url: ${{ github.server_url }}/${{ github.repository }}

    steps:
      # Step 1: Get your code onto the VM
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'        # Cache node_modules for faster builds
          cache-dependency-path: ek-portfolio/package-lock.json

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci            # 'ci' is stricter than 'install' — uses lockfile exactly

      # Step 4: Build the project
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      # Step 5: Configure GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Step 6: Upload the built files
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./ek-portfolio/dist    # Vite outputs to ek-portfolio/dist/

      # Step 7: Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4